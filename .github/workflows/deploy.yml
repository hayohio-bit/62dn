name: Deploy (EC2)

# 기본은 수동 실행이다 (Actions 탭 → Deploy (EC2) → Run workflow).
# 저장소 변수 DEPLOY_ENABLED=true 를 설정하면 main push 때도 자동 배포한다.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          missing=""
          for name in EC2_HOST EC2_SSH_KEY RDS_ENDPOINT RDS_USERNAME RDS_PASSWORD JWT_SECRET FRONTEND_URL; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿이 비어 있습니다:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Backend test & build
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_MAP_API_KEY: ${{ secrets.VITE_MAP_API_KEY }}
          VITE_KAKAO_CLIENT_ID: ${{ secrets.VITE_KAKAO_CLIENT_ID }}
          VITE_KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir -p package
          cp backend/build/libs/platform-0.0.1-SNAPSHOT.jar package/
          cp -r frontend/dist package/frontend-dist
          cp deploy/nginx.conf deploy/dn-platform.service deploy/logrotate.conf package/
          tar -czf deploy.tar.gz package

      - name: Upload package to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy.tar.gz
          target: /home/ec2-user/

      - name: Install and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
          KAKAO_CLIENT_ID: ${{ secrets.VITE_KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: RDS_ENDPOINT,RDS_USERNAME,RDS_PASSWORD,JWT_SECRET,FRONTEND_URL,DATA_API_KEY,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,ADMIN_BOOTSTRAP_EMAIL,ADMIN_BOOTSTRAP_PASSWORD
          script: |
            set -euo pipefail
            cd /home/ec2-user
            rm -rf package && tar -xzf deploy.tar.gz && rm -f deploy.tar.gz

            # 백엔드 실행 파일과 환경 변수 (값은 로그에 출력하지 않는다)
            mkdir -p app
            cp package/platform-0.0.1-SNAPSHOT.jar app/
            umask 077
            {
              echo "SPRING_PROFILES_ACTIVE=prod"
              echo "DB_URL=jdbc:mysql://${RDS_ENDPOINT}/dn_platform?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
              echo "DB_USERNAME=${RDS_USERNAME}"
              echo "DB_PASSWORD=${RDS_PASSWORD}"
              echo "JWT_SECRET=${JWT_SECRET}"
              echo "FRONTEND_URL=${FRONTEND_URL}"
              echo "CORS_ALLOWED_ORIGINS=${FRONTEND_URL}"
              echo "DATA_API_KEY=${DATA_API_KEY:-}"
              echo "KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}"
              echo "KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-}"
              echo "KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-}"
              echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}"
              echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}"
              echo "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}"
              echo "ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-}"
              echo "ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}"
            } > app/.env.prod
            umask 022

            # 프론트엔드 정적 파일
            sudo mkdir -p /var/www/dn-platform
            sudo rm -rf /var/www/dn-platform/*
            sudo cp -r package/frontend-dist/* /var/www/dn-platform/

            # nginx, systemd, logrotate 설정
            # nginx.conf 기본 server 블록이 80 포트를 먼저 잡지 않도록 주석 처리한다 (한 번만 적용됨)
            if grep -q "^    server {" /etc/nginx/nginx.conf; then
              sudo sed -i '/^    server {/,/^    }/s/^/#/' /etc/nginx/nginx.conf
            fi
            sudo cp package/nginx.conf /etc/nginx/conf.d/dn-platform.conf
            sudo nginx -t && sudo systemctl reload nginx
            sudo cp package/dn-platform.service /etc/systemd/system/dn-platform.service
            sudo cp package/logrotate.conf /etc/logrotate.d/dn-platform
            sudo systemctl daemon-reload
            sudo systemctl enable dn-platform
            sudo systemctl restart dn-platform

            # 헬스 체크: 최대 90초 동안 API 응답을 기다린다
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null "http://127.0.0.1:8080/api/animals?size=1"; then
                echo "[배포] 백엔드 응답 확인"
                exit 0
              fi
              sleep 3
            done
            echo "[배포 실패] 백엔드가 응답하지 않습니다. err.out 마지막 40줄:"
            tail -40 /home/ec2-user/err.out || true
            exit 1
