name: DN Platform Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build Backend
        run: |
          cd backend
          ./gradlew clean bootJar -x test
          ls -la build/libs/*.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_MAP_API_KEY: ${{ secrets.VITE_MAP_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_KAKAO_CLIENT_ID: ${{ secrets.VITE_KAKAO_CLIENT_ID }}
          VITE_KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
        run: |
          cd frontend
          npm ci
          npm run build
          ls -la dist/

      - name: Create deploy package
        run: |
          mkdir -p deploy
          cp backend/build/libs/platform-0.0.1-SNAPSHOT.jar deploy/
          cp -r frontend/dist deploy/frontend-dist
          tar -czvf deploy.tar.gz deploy/

      - name: Verify secrets (DB 연결용)
        run: |
          missing=""
          [ -z "${{ secrets.RDS_ENDPOINT }}" ] && missing="RDS_ENDPOINT $missing"
          [ -z "${{ secrets.RDS_USERNAME }}" ] && missing="RDS_USERNAME $missing"
          [ -z "${{ secrets.RDS_PASSWORD }}" ] && missing="RDS_PASSWORD $missing"
          [ -z "${{ secrets.EC2_HOST }}" ] && missing="EC2_HOST $missing"
          [ -z "${{ secrets.EC2_SSH_KEY }}" ] && missing="EC2_SSH_KEY $missing"
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿이 비어 있음: $missing (GitHub Settings → Secrets and variables → Actions 확인)"
            exit 1
          fi
          echo "[배포] RDS/EC2 시크릿 존재 확인 완료 (값은 로그에 출력하지 않음)"

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ec2-user/"

      - name: Extract and Restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: RDS_ENDPOINT,RDS_USERNAME,RDS_PASSWORD,JWT_SECRET,JWT_ACCESS_VALIDITY,JWT_REFRESH_VALIDITY,DATA_API_KEY,FRONTEND_URL,PUBLIC_API_SYNC_ENABLED,PUBLIC_API_SYNC_CRON,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI
          script: |
            set -e
            cd /home/ec2-user
            if [ -z "${RDS_ENDPOINT}" ]; then
              echo "[배포 오류] RDS_ENDPOINT가 EC2에 전달되지 않음. GitHub Actions envs/시크릿 확인 필요."
              exit 1
            fi
            echo "[배포] 서버 진단 정보 (Java 버전):"
            java -version || echo "Java가 설치되지 않았거나 경로 오류"
            tar -xzvf deploy.tar.gz
            mkdir -p app
            cp deploy/platform-0.0.1-SNAPSHOT.jar app/
            sudo mkdir -p /var/www/dn-platform
            sudo cp -r deploy/frontend-dist/* /var/www/dn-platform/
            sudo tee /etc/nginx/conf.d/dn-platform.conf > /dev/null << 'NGINX'
            server {
                listen 80;
                server_name _;
                root /var/www/dn-platform;
                index index.html;
                try_files $uri $uri/ /index.html;
                location /api/ {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_read_timeout 300s;
                    proxy_connect_timeout 300s;
                }
                location /swagger-ui {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                location /v3/api-docs {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                location = /swagger-ui.html {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
            }
            NGINX
            sudo sed -i 's/^[[:space:]]*//' /etc/nginx/conf.d/dn-platform.conf

            # Phase 1-3: Nginx 서버 버전 정보 숨기기
            if ! grep -q "server_tokens off;" /etc/nginx/nginx.conf; then
              sudo sed -i '/http {/a \    server_tokens off;' /etc/nginx/nginx.conf
            fi

            # Phase 2-1: Nginx 기본 server 블록 비활성화
            if grep -q "^    server {" /etc/nginx/nginx.conf; then
              sudo sed -i '/^    server {/,/^    }/s/^/#/' /etc/nginx/nginx.conf
            fi

            sudo nginx -t && sudo systemctl reload nginx

            # Phase 3-1: 로그 로테이션 설정
            sudo tee /etc/logrotate.d/dn-platform > /dev/null << 'LOGROTATE'
            /home/ec2-user/log.out /home/ec2-user/err.out {
                daily
                rotate 7
                compress
                missingok
                notifempty
                copytruncate
            }
            LOGROTATE
            sudo chmod 644 /etc/logrotate.d/dn-platform

            DB_URL="jdbc:mysql://${RDS_ENDPOINT}/dn_platform?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            if [ -n "${FRONTEND_URL}" ]; then
              CORS_ORIGINS="http://localhost:5173,http://localhost:3000,http://3.35.68.178,http://3.35.68.178.nip.io,${FRONTEND_URL}"
            else
              CORS_ORIGINS="http://localhost:5173,http://localhost:3000,http://3.35.68.178,http://3.35.68.178.nip.io"
            fi
            echo "SPRING_PROFILES_ACTIVE=prod" > /home/ec2-user/app/.env.prod
            echo "DB_URL=${DB_URL}" >> /home/ec2-user/app/.env.prod
            echo "DB_USERNAME=${RDS_USERNAME}" >> /home/ec2-user/app/.env.prod
            echo "DB_PASSWORD=${RDS_PASSWORD}" >> /home/ec2-user/app/.env.prod
            echo "SPRING_DATASOURCE_URL=${DB_URL}" >> /home/ec2-user/app/.env.prod
            echo "SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}" >> /home/ec2-user/app/.env.prod
            echo "SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}" >> /home/ec2-user/app/.env.prod
            echo "JWT_SECRET=${JWT_SECRET}" >> /home/ec2-user/app/.env.prod
            echo "JWT_ACCESS_TOKEN_VALIDITY=${JWT_ACCESS_VALIDITY:-86400}" >> /home/ec2-user/app/.env.prod
            echo "JWT_REFRESH_TOKEN_VALIDITY=${JWT_REFRESH_VALIDITY:-2592000}" >> /home/ec2-user/app/.env.prod
            echo "PUBLIC_API_SERVICE_KEY=${DATA_API_KEY}" >> /home/ec2-user/app/.env.prod
            echo "PUBLIC_API_SYNC_ENABLED=${PUBLIC_API_SYNC_ENABLED:-false}" >> /home/ec2-user/app/.env.prod
            echo "PUBLIC_API_SYNC_CRON=${PUBLIC_API_SYNC_CRON:-0 0 17 * * *}" >> /home/ec2-user/app/.env.prod
            echo "APP_FRONTEND_URL=${FRONTEND_URL}" >> /home/ec2-user/app/.env.prod
            echo "CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}" >> /home/ec2-user/app/.env.prod
            echo "KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}" >> /home/ec2-user/app/.env.prod
            echo "KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}" >> /home/ec2-user/app/.env.prod
            echo "KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}" >> /home/ec2-user/app/.env.prod
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> /home/ec2-user/app/.env.prod
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> /home/ec2-user/app/.env.prod
            echo "GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}" >> /home/ec2-user/app/.env.prod
            chmod 600 /home/ec2-user/app/.env.prod

            echo '#!/bin/bash' > app/start.sh
            echo 'cd /home/ec2-user/app' >> app/start.sh
            echo 'exec java -Xmx512m -jar platform-0.0.1-SNAPSHOT.jar' >> app/start.sh
            chmod +x app/start.sh

            if grep -q 'jdbc:mysql://' /home/ec2-user/app/.env.prod && grep -q 'dn_platform' /home/ec2-user/app/.env.prod; then
              echo "[배포] .env.prod DB URL 설정 확인됨 (jdbc:mysql://.../dn_platform)"
            else
              echo "[배포 경고] .env.prod에 DB URL이 기대한 형식으로 없음. cat .env.prod 로 확인 필요."
            fi

            echo '[Unit]' | sudo tee /etc/systemd/system/dn-platform.service > /dev/null
            echo 'Description=DN Platform Backend' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'After=network.target' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo '' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo '[Service]' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'Type=simple' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'User=ec2-user' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'WorkingDirectory=/home/ec2-user/app' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'EnvironmentFile=/home/ec2-user/app/.env.prod' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'ExecStart=/home/ec2-user/app/start.sh' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'Restart=on-failure' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'RestartSec=5' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'StandardOutput=append:/home/ec2-user/log.out' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'StandardError=append:/home/ec2-user/err.out' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo '' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo '[Install]' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            echo 'WantedBy=multi-user.target' | sudo tee -a /etc/systemd/system/dn-platform.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable dn-platform
            sudo systemctl restart dn-platform
            sleep 3
            sudo systemctl is-active dn-platform && echo "[배포] dn-platform 서비스 기동됨" || echo "[배포 경고] dn-platform 서비스 비활성"
            echo "[배포] err.out 마지막 30줄 (DB 연결 오류 확인용):"
            tail -30 /home/ec2-user/err.out 2>/dev/null || true
            rm -f /home/ec2-user/deploy.tar.gz
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_VALIDITY: ${{ secrets.JWT_ACCESS_VALIDITY }}
          JWT_REFRESH_VALIDITY: ${{ secrets.JWT_REFRESH_VALIDITY }}
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          PUBLIC_API_SYNC_ENABLED: ${{ secrets.PUBLIC_API_SYNC_ENABLED }}
          PUBLIC_API_SYNC_CRON: ${{ secrets.PUBLIC_API_SYNC_CRON }}
          KAKAO_CLIENT_ID: ${{ secrets.VITE_KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
