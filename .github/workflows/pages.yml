name: Pages (정적 사이트 게시)

# 매일 03:20(KST)에 공공데이터를 받아 스냅샷을 만들고 사이트를 GitHub Pages에 게시한다.
# 아래 설정을 사용자가 마치기 전에는 자동 실행(schedule, push)이 아무것도 하지 않는다.
#   1. Settings → Pages → Build and deployment → Source 를 "GitHub Actions"로 바꾼다
#   2. Settings → Secrets and variables → Actions 에 비밀값 DATA_API_KEY(공공데이터포털 서비스 키, 디코딩 값)를 등록한다
#   3. 같은 화면의 Variables 에 PAGES_ENABLED=true 를 등록한다
# 수동 실행(workflow_dispatch)은 변수와 상관없이 가능하다. 공개 저장소는 60일 동안 활동이 없으면 schedule 이 꺼지므로 가끔 수동 실행한다.
on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# build 잡은 외부 패키지를 설치하므로 읽기 권한만 준다. 게시 권한은 deploy 잡에만 둔다
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 스냅샷 생성과 빌드
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # 키가 없으면 데모 데이터가 실서비스에 올라가지 않도록 여기서 멈춘다
      - name: Check data API key
        env:
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
        run: |
          if [ -z "$DATA_API_KEY" ]; then
            echo "::error::비밀값 DATA_API_KEY가 비어 있습니다 (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Fetch data snapshot
        working-directory: frontend
        env:
          DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
        run: npm run data:fetch

      - name: Build
        working-directory: frontend
        env:
          VITE_MAP_API_KEY: ${{ secrets.VITE_MAP_API_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Pages 게시
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
