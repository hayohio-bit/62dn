spring:
  profiles:
    active: dev

  application:
    name: dn-platform

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  # File Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 업로드 파일 저장 경로 (상대 경로 = 서버 실행 시 작업 디렉터리 기준)
# 예: backend/에서 gradlew 실행 시 → backend/uploads. 다른 경로에서 실행하면 파일을 찾지 못할 수 있으므로,
# 재시작 시 같은 디렉터리에서 실행하거나 file.upload-dir을 절대 경로로 설정하세요.
file:
  upload-dir: uploads

# Server Configuration
server:
  port: 8080

# CORS (comma-separated origins)
cors:
  allowed-origins: http://localhost:5173,http://localhost:5175,http://localhost:3000

# 프론트엔드 URL (이메일 내 관리자 로그인 바로가기 링크 등)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # 최초 관리자 계정: 두 값이 모두 있고 그 이메일의 회원이 없을 때만 한 번 만든다 (운영은 환경 변수로 지정)
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

# JWT Configuration
jwt:
  # 운영에서는 JWT_SECRET 환경 변수가 필수다 (없으면 기동 실패). local/dev 프로필만 기본값을 둔다.
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:86400} # 24 hours (로그인 유지 개선)
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:2592000} # 30 days

# 환경 변수: DATA_API_KEY 또는 PUBLIC_API_SERVICE_KEY
# base-url: 1543061 (TeamApple 등 실제 사용). 500 시 활용신청 후 본인 Encoding 키 사용
public-api:
  service-key: ${DATA_API_KEY:${PUBLIC_API_SERVICE_KEY:your-public-api-service-key}}
  base-url: ${PUBLIC_API_BASE_URL:https://apis.data.go.kr/1543061}
  # 스케줄 동기화: true 시 매일 지정 시간에 공공데이터 자동 수집 (일 1회 권장)
  sync-enabled: ${PUBLIC_API_SYNC_ENABLED:true}
  sync-cron: ${PUBLIC_API_SYNC_CRON:0 0 2 * * *} # 기본: 매일 새벽 2시 (초 분 시 일 월 요일)

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
